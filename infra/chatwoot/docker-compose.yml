version: '3.8'

# Chatwoot 自托管（仅作客服收件箱，线索主数据仍在自有 Postgres）。
# 本地联调用：web=3300，postgres=5435，redis=6382，避免与 Payload(5434) 冲突。
services:
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_dev
    volumes:
      - chatwoot-postgres-data:/var/lib/postgresql/data
    ports:
      - '5435:5432'

  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - chatwoot-redis-data:/data
    ports:
      - '6382:6379'

  chatwoot:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    entrypoint: /bin/sh -c 'bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0'
    environment:
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: chatwoot_dev
      REDIS_URL: redis://chatwoot-redis:6379
      SECRET_KEY_BASE: 7af5e12f8b0d596bd1c87a398ec693a202e7dcf8c9d365d57a08ebc3c10afd1dcfb3d518e3a2da6a2ab0c80fa77e0c937224bed49f87370fd06a39bec025a6d5
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      LOG_LEVEL: info
      FRONTEND_URL: http://localhost:3300
      DEFAULT_LOCALE: zh_CN
      ENABLE_ACCOUNT_SIGNUP: 'true'
    ports:
      - '3300:3000'

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      POSTGRES_HOST: chatwoot-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: chatwoot_dev
      REDIS_URL: redis://chatwoot-redis:6379
      SECRET_KEY_BASE: 7af5e12f8b0d596bd1c87a398ec693a202e7dcf8c9d365d57a08ebc3c10afd1dcfb3d518e3a2da6a2ab0c80fa77e0c937224bed49f87370fd06a39bec025a6d5
      RAILS_ENV: production
      NODE_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      LOG_LEVEL: info
      FRONTEND_URL: http://localhost:3300

volumes:
  chatwoot-postgres-data:
  chatwoot-redis-data: