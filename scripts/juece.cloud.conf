# juece-grow 生产站点 juece.cloud —— 1Panel 管理，仅本文件为自管配置
# 路由：/admin /api /_next /media -> CMS 容器(127.0.0.1:3100)；其余 -> Astro 静态

server {
    listen 80;
    server_name juece.cloud;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location = /nvmColFPTC.txt {
        alias /www/sites/juece.cloud/index/nvmColFPTC.txt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name juece.cloud;
    index index.html index.htm;

    access_log /www/sites/juece.cloud/log/access.log main;
    error_log /www/sites/juece.cloud/log/error.log;

    ssl_certificate /www/sites/juece.cloud/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/juece.cloud/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    location = /nvmColFPTC.txt {
        alias /www/sites/juece.cloud/index/nvmColFPTC.txt;
    }

    # ---- juece-grow CMS：admin / API / Next 资源 / 媒体 ----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600;
        proxy_connect_timeout 60;
        proxy_pass http://127.0.0.1:3100;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600;
        proxy_connect_timeout 60;
        proxy_pass http://127.0.0.1:3100;
    }
    location /_next/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3100;
    }
    location /media/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3100;
    }

    # ---- Astro 公开站静态文件 ----
    location / {
        root /www/sites/juece.cloud/index;
        try_files $uri $uri/index.html $uri.html =404;
    }
}